<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · ENTERPRISER • DRIVE MAXX</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <form id="login-form" class="login-card" method="post" action="/auth/app-login" novalidate>
      <span class="brand login-brand"><span class="brand-mark">D<span>↗</span></span><span>ENTERPRISER <b>•</b> <strong>DRIVE MAXX</strong></span></span>
      <h1>Acesse sua conta</h1>
      <p>Entre com o usuário e a senha do DRIVE MAXX.</p>
      <label class="login-field"><span>Usuário</span><input id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="login-field"><span>Senha</span><input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button id="login-submit" class="button primary login-submit" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
